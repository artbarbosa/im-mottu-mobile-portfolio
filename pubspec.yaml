name: mottu_marvel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  crypto: ^3.0.3
  http: ^1.2.1
  flutter_modular: ^6.3.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  hive: ^2.2.3
  path_provider: ^2.1.3
  lottie: ^3.1.2
  firebase_crashlytics: ^4.0.2
  firebase_analytics: ^11.1.0
  firebase_core: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/